# INTERVAL -- build and publish the site to GitHub Pages.
#
# On every push to main, and on a schedule. The schedule is what keeps page
# 401 current: market closes come from FRED, which a browser cannot read
# (no CORS), so tools/fetch-markets.mjs fetches them HERE and they are
# published beside the site as markets.json. Nothing else is built -- there
# is no build step -- so a scheduled run republishes the same app with fresh
# closes. The build stamp does not change on a scheduled run: the code did
# not, and markets.json is fetched by the set like any feed, not imported.
#
# Remember `npm run stamp` (SHIP does it) before pushing a change to the app.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 13:30 and 22:30 UTC, weekdays: after FRED's morning update, and after
    # the US close. FRED's closes are a day behind; twice is plenty.
    - cron: '30 13,22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A failed fetch must not stop the deploy, and must not delete the
      # last good closes either. 2026-10-01: Pages replaces the WHOLE site,
      # so a run that went out without markets.json took the previous one
      # down with it, and 401 went off air over one bad FRED morning. Now the
      # fetcher is handed the live copy (--previous): a series that fails is
      # carried over with its own date, and if none answers the live file is
      # republished as it was, its `at` unchanged, so 401 says how old it is.
      # The curl is for a fetcher that died outright; only with neither does
      # the site go out without one, and 401 says it is off air.
      - name: Fetch market closes
        # From GITHUB_REPOSITORY, not github.event.repository: a scheduled
        # run's event has no repository in it.
        run: |
          LIVE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/markets.json"
          node tools/fetch-markets.mjs --previous="$LIVE" \
            || { curl -fsS --max-time 30 -o markets.json "$LIVE" \
                 && node -e 'const m = JSON.parse(require("fs").readFileSync("markets.json", "utf8")); if (!m.series?.length) process.exit(1)' \
                 && echo "::warning::market closes could not be fetched; republishing the live markets.json"; } \
            || { rm -f markets.json; echo "::warning::market closes could not be fetched, and no live copy to keep"; }
      - name: Assemble the site
        run: node tools/build-site.mjs --out=_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
